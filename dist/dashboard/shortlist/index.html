<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Your Supplier Shortlist — WedSparks</title>
  <link rel="stylesheet" href="../../styles.css">
  <link rel="stylesheet" href="../../auth.css">
  <script type="module" src="../../shared/shortlist.js"></script>
<script type="module" src="../../shared/header-auth.js"></script>
  <link rel="stylesheet" href="../dashboard.css">
  <script type="module" src="../../shared/dashboard-navigation.js"></script>
</head>
<body class="auth-page" data-account="couple" data-page="shortlist">
  <header class="site-header">
    <nav class="header-side header-left" aria-label="Primary navigation">
      <a class="header-nav-link" href="../../marketplace-search/">Search Marketplace</a>
      <a class="header-nav-link" href="../../supplier-category/">Category Search</a>
      <button type="button" disabled>Option 3</button>
    </nav>
    <a class="brand" href="../../" aria-label="WedSparks home"><svg viewBox="0 0 52 46" aria-hidden="true"><path d="M23 39 5 20C-4 5 14-3 23 8M29 39 47 20C56 5 38-3 29 8M26 8C9-4 8 21 26 36 44 21 43-4 26 8Z"/></svg><span>WedSparks</span></a>
    <nav class="header-side header-right" aria-label="Account navigation">
      <button type="button" disabled>Option 4</button>
      <button class="header-action login" type="button" disabled>Log In</button>
      <button class="header-action signup" type="button" disabled>Sign Up</button>
    </nav>
    <button class="mobile-menu-toggle" type="button" aria-expanded="false" aria-controls="mobile-navigation" aria-label="Open navigation"><span></span><span></span><span></span></button>
    <nav class="mobile-nav-panel" id="mobile-navigation" aria-label="Mobile navigation" hidden><a class="header-nav-link" href="../../marketplace-search/">Search Marketplace</a><a class="header-nav-link" href="../../supplier-category/">Category Search</a><button type="button" disabled>Option 3</button><button type="button" disabled>Option 4</button><div class="mobile-account-actions"><button type="button" disabled>Log In</button><button type="button" disabled>Sign Up</button></div></nav>
  </header>
  <main class="auth-content">
  <p id="shortlist-loading" class="auth-intro" role="status">
    Loading your shortlist…
  </p>
  <section id="shortlist-content" hidden>
    <h1>Your Supplier Shortlist</h1>
    <p class="auth-intro">
      Find, review and organise the suppliers you’ve saved.
    </p>

    <form id="shortlist-filters" class="ws-shortlist-filters">
      <div class="ws-profile-field">
        <label for="sl-category">Supplier category</label>
        <select id="sl-category" name="category">
          <option value="">All saved categories</option>
        </select>
      </div>
      <div class="ws-profile-field">
        <label for="sl-state">State</label>
        <select id="sl-state" name="state">
          <option value="">All saved states</option>
        </select>
      </div>
      <div class="ws-profile-field">
        <label for="sl-city">City or suburb</label>
        <input id="sl-city" name="city" maxlength="100"
          placeholder="Search a location">
      </div>
      <div class="ws-profile-field">
        <label for="sl-name">Supplier name</label>
        <input id="sl-name" name="name" maxlength="100"
          placeholder="Search your saved suppliers">
      </div>
      <div class="ws-profile-field">
        <label for="sl-sort">Sort by</label>
        <select id="sl-sort" name="sort">
          <option value="newest">Recently saved</option>
          <option value="oldest">Oldest saved</option>
          <option value="name">Supplier name A–Z</option>
        </select>
      </div>
      <div class="ws-shortlist-filter-actions">
        <button class="auth-primary" type="submit">Apply filters</button>
        <button class="text-button" type="reset">Clear filters</button>
      </div>
    </form>

    <p id="shortlist-status" class="ws-profile-status"
      role="status" aria-live="polite"></p>
    <button id="shortlist-retry" class="text-button"
      type="button" hidden>Try again</button>
    <ul id="shortlist-results" class="ws-saved-grid"></ul>

    <nav class="ws-shortlist-pagination" aria-label="Shortlist pages">
      <button id="shortlist-previous" class="text-button"
        type="button" disabled>Previous</button>
      <span id="shortlist-page"></span>
      <button id="shortlist-next" class="text-button"
        type="button" disabled>Next</button>
    </nav>

    <p class="auth-login-footer">
      <a id="shortlist-browse">Find more wedding suppliers</a>
    </p>
  </section>
</main>
</body>
</html>
