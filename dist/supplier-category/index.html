    <a class="brand" href="../" aria-label="WedSparks home"><svg viewBox="0 0 52 46" aria-hidden="true"><path d="M23 39 5 20C-4 5 14-3 23 8M29 39 47 20C56 5 38-3 29 8M26 8C9-4 8 21 26 36 44 21 43-4 26 8Z"/></svg><span>WedSparks</span></a>
    <nav class="header-side header-right" aria-label="Account navigation"><button type="button" disabled>Option 4</button><button class="header-action login" type="button" disabled>Log In</button><button class="header-action signup" type="button" disabled>Sign Up</button></nav>

  </header>
  <main>
    <section class="marketplace-hero" aria-label="Vendor category">
      <h1 class="marketplace-title">Vendor Category</h1>
    </section>
    <section class="supplier-category-content" id="supplier-category-content" aria-labelledby="supplier-results-title">
      <h2 id="supplier-results-title">
        <span>467</span>
        <span class="supplier-heading-filter">
          <button type="button" aria-expanded="false" aria-controls="heading-category-options" data-heading-filter="heading-category-options"><span>WEDDING CATEGORY</span><i aria-hidden="true"></i></button>
          <span class="supplier-heading-menu" id="heading-category-options" hidden><button type="button">Venue</button><button type="button">Photographer</button><button type="button">Florist</button><button type="button">Celebrant</button><button type="button">Catering</button><button type="button">Entertainment</button></span>
        </span>
        <span>IN</span>
        <span class="supplier-heading-filter">
          <button type="button" aria-expanded="false" aria-controls="heading-location-options" data-heading-filter="heading-location-options"><span>LOCATION</span><i aria-hidden="true"></i></button>

        </span>

      <div class="supplier-filter-list" aria-label="Supplier filters">
        <div class="supplier-filter">
          <button class="supplier-filter-pill" type="button" aria-expanded="false" aria-controls="supplier-price-options" data-filter-trigger="supplier-price-options">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 13 13 20 3 10V3h7l10 10Z"/><circle cx="8" cy="8" r="1.5"/></svg><span>Starting Price</span><i aria-hidden="true"></i>

        </div>
        <div class="supplier-filter">
          <button class="supplier-filter-pill" type="button" aria-expanded="false" aria-controls="supplier-date-options" data-filter-trigger="supplier-date-options">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 2v6m10-6v6M3 11h18"/></svg><span>Date</span><i aria-hidden="true"></i>

        <div class="supplier-filter">
          <button class="supplier-filter-pill" type="button" aria-expanded="false" aria-controls="supplier-style-options" data-filter-trigger="supplier-style-options">

        </div>
        <div class="supplier-filter">

            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10m4 0h2M4 17h2m4 0h10M4 12h4m4 0h8"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/><circle cx="10" cy="12" r="2"/></svg><span>More Filters</span><i aria-hidden="true"></i>

        </div>
      </div>
    </section>
